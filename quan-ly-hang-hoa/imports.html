<!DOCTYPE html>
<!--
  File: imports.html
  Đường dẫn: chi tiêu/imports.html
  Mục đích: Nhập kho — tạo phiếu nhập nhiều dòng hàng (tự cộng tồn kho bằng
            transaction) và danh sách phiếu nhập (lọc, phân trang, xem, huỷ)
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhập kho | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
  <div class="auth-loading-screen"><div class="spinner-border text-primary" role="status" aria-label="Đang tải"></div></div>

  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="createTabButton" data-bs-toggle="tab" data-bs-target="#createTab" type="button" role="tab">
              <i class="bi bi-plus-circle me-1"></i>Tạo phiếu nhập
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="listTabButton" data-bs-toggle="tab" data-bs-target="#listTab" type="button" role="tab">
              <i class="bi bi-list-ul me-1"></i>Danh sách phiếu nhập
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- ===================== TẠO PHIẾU NHẬP ===================== -->
          <div class="tab-pane fade show active" id="createTab" role="tabpanel">
            <form id="importForm" novalidate>
              <div class="row g-3">
                <div class="col-lg-8">
                  <div class="card h-100">
                    <div class="card-header"><i class="bi bi-box-arrow-in-down me-2"></i>Hàng nhập</div>
                    <div class="card-body">
                      <div class="search-picker mb-3">
                        <div class="input-group">
                          <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                          <input type="search" class="form-control" id="importProductSearch"
                                 placeholder="Gõ tên / mã hàng hoặc quét mã vạch rồi nhấn Enter...">
                        </div>
                      </div>
                      <div class="table-responsive">
                        <table class="table align-middle line-items-table mb-0">
                          <thead>
                            <tr>
                              <th class="col-product">Hàng hoá</th>
                              <th class="text-center">Tồn hiện tại</th>
                              <th style="width:130px">Số lượng</th>
                              <th style="width:160px">Đơn giá nhập (đ)</th>
                              <th class="text-end">Thành tiền</th>
                              <th></th>
                            </tr>
                          </thead>
                          <tbody id="importLinesBody"></tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-lg-4">
                  <div class="card h-100">
                    <div class="card-header"><i class="bi bi-receipt me-2"></i>Thông tin phiếu</div>
                    <div class="card-body">
                      <div class="mb-3">
                        <label for="importDate" class="form-label">Ngày nhập <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="importDate" required>
                        <div class="invalid-feedback">Vui lòng chọn ngày nhập (không sau hôm nay).</div>
                      </div>
                      <div class="mb-3">
                        <label for="importNote" class="form-label">Ghi chú</label>
                        <textarea class="form-control" id="importNote" rows="2" maxlength="1000"></textarea>
                      </div>
                      <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="importUpdateCost" checked>
                        <label class="form-check-label" for="importUpdateCost">
                          Cập nhật giá nhập của hàng hoá (bình quân gia quyền)
                        </label>
                      </div>
                      <div class="total-box mb-3">
                        <div class="d-flex justify-content-between small text-muted">
                          <span>Số dòng hàng</span><span id="importLineCount">0</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                          <span class="fw-semibold">Tổng tiền</span>
                          <span class="grand-total text-money" id="importGrandTotal">0 đ</span>
                        </div>
                      </div>
                      <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg" id="importSubmitButton">
                          <i class="bi bi-check2-circle me-2"></i>Lưu phiếu nhập
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="importResetButton">
                          <i class="bi bi-arrow-counterclockwise me-1"></i>Làm lại
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>

          <!-- ===================== DANH SÁCH PHIẾU NHẬP ===================== -->
          <div class="tab-pane fade" id="listTab" role="tabpanel">
            <div class="card">
              <div class="card-body border-bottom">
                <div class="row g-2 align-items-end">
                  <div class="col-md-4">
                    <label class="form-label small mb-1" for="filterImportCode">Số phiếu</label>
                    <input type="search" class="form-control" id="filterImportCode" placeholder="VD: PN000001" maxlength="30">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label small mb-1" for="filterFromDate">Từ ngày</label>
                    <input type="date" class="form-control" id="filterFromDate">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label small mb-1" for="filterToDate">Đến ngày</label>
                    <input type="date" class="form-control" id="filterToDate">
                  </div>
                  <div class="col-md-2">
                    <select class="form-select" id="importPageSize" aria-label="Số dòng mỗi trang">
                      <option value="10">10 dòng/trang</option>
                      <option value="20">20 dòng/trang</option>
                      <option value="50">50 dòng/trang</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Số phiếu</th><th>Ngày nhập</th>
                      <th class="text-center">Số dòng</th><th class="text-end">Tổng tiền</th>
                      <th class="text-center">Trạng thái</th><th class="text-end">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="importListBody"></tbody>
                </table>
              </div>
              <div class="card-body border-top" id="importPagination"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal chi tiết phiếu nhập -->
  <div class="modal fade" id="importDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="importDetailTitle">Phiếu nhập</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body" id="importDetailBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from "./js/layout.js";
    import { initImportsPage } from "./js/imports.js";
    initPage({ pageId: "imports", title: "Nhập kho" }, initImportsPage);
  </script>
</body>
</html>
