<!DOCTYPE html>
<!--
  File: invoice-print.html
  Đường dẫn: chi tiêu/invoice-print.html
  Mục đích: In hoá đơn bán hàng. Mở bằng invoice-print.html?id=<invoiceId>
            (thêm &print=1 để tự bật hộp thoại in). Chọn khổ A5 hoặc K80
            (máy in nhiệt 80mm).
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In hoá đơn | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Khổ giấy hoá đơn: thêm class paper-a5 / paper-k80 vào <body> */
    .receipt {
      background: #fff;
      margin: 1.5rem auto;
      padding: 1.5rem;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
      color: #000;
      font-size: 13px;
    }
    .paper-a5 .receipt { width: 148mm; min-height: 200mm; }
    .paper-k80 .receipt { width: 80mm; padding: 4mm; font-size: 12px; }
    .receipt .store-name { font-size: 1.2em; font-weight: 700; text-transform: uppercase; }
    .receipt table { width: 100%; border-collapse: collapse; }
    .receipt .items th,
    .receipt .items td { padding: 4px 2px; border-bottom: 1px dashed #999; vertical-align: top; }
    .receipt .totals td { padding: 2px; }
    .receipt .grand { font-size: 1.25em; font-weight: 700; }
    .receipt .cancelled-stamp {
      border: 3px solid #dc3545;
      color: #dc3545;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      margin-bottom: 8px;
      transform: rotate(-3deg);
    }
    .paper-k80 .receipt .hide-on-k80 { display: none; }

    @media print {
      .print-toolbar { display: none !important; }
      body { background: #fff !important; }
      .receipt { margin: 0; box-shadow: none; }
      .paper-a5 .receipt { width: 100%; min-height: auto; padding: 0; }
      .paper-k80 .receipt { width: 100%; padding: 0; }
    }
  </style>
  <!-- Khổ giấy khi in (đổi bằng JavaScript theo lựa chọn) -->
  <style id="pageSizeStyle">@media print { @page { size: A5; margin: 8mm; } }</style>
</head>
<body class="auth-pending paper-a5 bg-light">
  <div class="auth-loading-screen"><div class="spinner-border text-primary" role="status" aria-label="Đang tải"></div></div>

  <div class="app-wrapper d-block">
    <div class="print-toolbar bg-white border-bottom py-2 px-3 d-flex flex-wrap align-items-center gap-2 sticky-top">
      <strong class="me-auto"><i class="bi bi-printer me-2"></i>In hoá đơn</strong>
      <div class="btn-group btn-group-sm" role="group" aria-label="Khổ giấy">
        <input type="radio" class="btn-check" name="paperSize" id="paperA5" value="a5" checked>
        <label class="btn btn-outline-secondary" for="paperA5">Khổ A5</label>
        <input type="radio" class="btn-check" name="paperSize" id="paperK80" value="k80">
        <label class="btn btn-outline-secondary" for="paperK80">Máy in nhiệt K80</label>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="printButton" disabled><i class="bi bi-printer me-1"></i>In</button>
      <button type="button" class="btn btn-outline-secondary btn-sm" id="closeButton"><i class="bi bi-x-lg me-1"></i>Đóng</button>
    </div>

    <div id="receiptContainer">
      <div class="text-center py-5"><div class="spinner-border"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { initInvoicePrintPage } from "./js/invoice-print.js";
    requireAuth(initInvoicePrintPage);
  </script>
</body>
</html>
