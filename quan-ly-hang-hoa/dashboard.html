<!DOCTYPE html>
<!--
  File: dashboard.html
  Đường dẫn: chi tiêu/dashboard.html
  Mục đích: Trang tổng quan sau khi đăng nhập
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
  <div class="auth-loading-screen"><div class="spinner-border text-primary" role="status" aria-label="Đang tải"></div></div>

  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <!-- Thẻ tổng quan -->
        <div class="row g-3 mb-4">
          <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-soft-success"><i class="bi bi-cash-coin"></i></div>
              <div><div class="stat-label">Doanh thu hôm nay</div><div class="stat-value text-money" id="statTodayRevenue">…</div></div>
            </div></div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-soft-primary"><i class="bi bi-receipt"></i></div>
              <div><div class="stat-label">Hoá đơn hôm nay</div><div class="stat-value" id="statTodayInvoices">…</div></div>
            </div></div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-soft-info"><i class="bi bi-box-seam"></i></div>
              <div><div class="stat-label">Mặt hàng</div><div class="stat-value" id="statProductCount">…</div></div>
            </div></div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-soft-danger"><i class="bi bi-exclamation-triangle"></i></div>
              <div><div class="stat-label">Hàng sắp hết</div><div class="stat-value" id="statLowStock">…</div></div>
            </div></div>
          </div>
        </div>

        <div class="row g-3">
          <!-- Hoá đơn gần đây (realtime) -->
          <div class="col-lg-7">
            <div class="card h-100">
              <div class="card-header d-flex align-items-center">
                <i class="bi bi-receipt me-2"></i>Hoá đơn gần đây
                <span class="badge text-bg-success ms-2 fw-normal"><i class="bi bi-broadcast"></i> realtime</span>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead><tr><th>Số HĐ</th><th>Thời gian</th><th class="text-end">Tổng tiền</th></tr></thead>
                  <tbody id="recentInvoicesBody">
                    <tr><td colspan="3" class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Hàng sắp hết (realtime) -->
          <div class="col-lg-5">
            <div class="card h-100">
              <div class="card-header d-flex align-items-center">
                <i class="bi bi-exclamation-triangle me-2 text-danger"></i>Hàng sắp hết
                <span class="badge text-bg-success ms-2 fw-normal"><i class="bi bi-broadcast"></i> realtime</span>
              </div>
              <ul class="list-group list-group-flush" id="lowStockList">
                <li class="list-group-item text-center py-4"><div class="spinner-border spinner-border-sm"></div></li>
              </ul>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from "./js/layout.js";
    import { initDashboard } from "./js/dashboard.js";
    initPage({ pageId: "dashboard", title: "Tổng quan" }, initDashboard);
  </script>
</body>
</html>
