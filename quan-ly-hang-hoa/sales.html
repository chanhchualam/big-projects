<!DOCTYPE html>
<!--
  File: sales.html
  Đường dẫn: chi tiêu/sales.html
  Mục đích: Bán hàng — màn hình thu ngân (tạo hoá đơn nhiều dòng, tự trừ tồn
            kho bằng transaction, không cho bán vượt tồn, in hoá đơn) và
            danh sách hoá đơn (lọc, phân trang, xem, in lại, huỷ)
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bán hàng | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
  <div class="auth-loading-screen"><div class="spinner-border text-primary" role="status" aria-label="Đang tải"></div></div>

  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#posTab" type="button" role="tab">
              <i class="bi bi-cart-check me-1"></i>Bán hàng
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#invoiceListTab" type="button" role="tab">
              <i class="bi bi-list-ul me-1"></i>Danh sách hoá đơn
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- ===================== MÀN HÌNH BÁN HÀNG ===================== -->
          <div class="tab-pane fade show active" id="posTab" role="tabpanel">
            <form id="saleForm" novalidate>
              <div class="row g-3">
                <div class="col-lg-8">
                  <div class="card h-100">
                    <div class="card-header d-flex align-items-center">
                      <i class="bi bi-basket me-2"></i>Giỏ hàng
                      <span class="ms-auto small text-muted d-none d-md-inline">F2: tìm hàng · F9: thanh toán</span>
                    </div>
                    <div class="card-body">
                      <div class="search-picker mb-3">
                        <div class="input-group input-group-lg">
                          <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                          <input type="search" class="form-control" id="saleProductSearch"
                                 placeholder="Gõ tên / mã hàng hoặc quét mã vạch rồi nhấn Enter...">
                        </div>
                      </div>
                      <div class="table-responsive">
                        <table class="table align-middle line-items-table mb-0">
                          <thead>
                            <tr>
                              <th class="col-product">Hàng hoá</th>
                              <th style="width:150px">Đơn giá (đ)</th>
                              <th style="width:130px">Số lượng</th>
                              <th class="text-end">Thành tiền</th>
                              <th></th>
                            </tr>
                          </thead>
                          <tbody id="cartBody"></tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-lg-4">
                  <div class="card h-100">
                    <div class="card-header"><i class="bi bi-wallet2 me-2"></i>Thanh toán</div>
                    <div class="card-body">
                      <!-- Tổng tiền -->
                      <div class="total-box mb-3">
                        <div class="d-flex justify-content-between">
                          <span>Tạm tính (<span id="cartItemCount">0</span> món)</span>
                          <span class="text-money" id="cartSubtotal">0 đ</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                          <label for="saleDiscount" class="mb-0">Giảm giá (đ)</label>
                          <input type="text" inputmode="numeric" autocomplete="off" class="form-control form-control-sm text-end money-input" id="saleDiscount"
                                 value="0" style="max-width:140px">
                        </div>
                        <hr class="my-2">
                        <div class="d-flex justify-content-between align-items-center">
                          <span class="fw-semibold">Khách cần trả</span>
                          <span class="grand-total text-money" id="cartTotal">0 đ</span>
                        </div>
                      </div>

                      <!-- Thanh toán -->
                      <div class="mb-2">
                        <div class="btn-group w-100" role="group" aria-label="Phương thức thanh toán">
                          <input type="radio" class="btn-check" name="paymentMethod" id="payCash" value="cash" checked>
                          <label class="btn btn-outline-primary" for="payCash"><i class="bi bi-cash"></i> Tiền mặt</label>
                          <input type="radio" class="btn-check" name="paymentMethod" id="payTransfer" value="transfer">
                          <label class="btn btn-outline-primary" for="payTransfer"><i class="bi bi-bank"></i> Chuyển khoản</label>
                          <input type="radio" class="btn-check" name="paymentMethod" id="payCard" value="card">
                          <label class="btn btn-outline-primary" for="payCard"><i class="bi bi-credit-card"></i> Thẻ</label>
                        </div>
                      </div>
                      <div id="cashBox" class="mb-3">
                        <label for="amountPaid" class="form-label small mb-1">Tiền khách đưa (đ)</label>
                        <input type="text" inputmode="numeric" autocomplete="off" class="form-control text-end money-input" id="amountPaid" placeholder="Bỏ trống = trả đúng số tiền">
                        <div class="d-flex flex-wrap gap-1 mt-2" id="quickCashButtons"></div>
                        <div class="d-flex justify-content-between mt-2">
                          <span>Tiền thừa trả khách</span>
                          <strong class="text-money" id="changeAmount">0 đ</strong>
                        </div>
                      </div>
                      <div class="mb-3">
                        <input type="text" class="form-control form-control-sm" id="saleNote" maxlength="1000" placeholder="Ghi chú hoá đơn (không bắt buộc)">
                      </div>
                      <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="printAfterSale" checked>
                        <label class="form-check-label" for="printAfterSale">In hoá đơn sau khi thanh toán</label>
                      </div>
                      <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg" id="checkoutButton">
                          <i class="bi bi-check2-circle me-2"></i>Thanh toán
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="clearCartButton">
                          <i class="bi bi-trash me-1"></i>Xoá giỏ hàng
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>

          <!-- ===================== DANH SÁCH HOÁ ĐƠN ===================== -->
          <div class="tab-pane fade" id="invoiceListTab" role="tabpanel">
            <div class="card">
              <div class="card-body border-bottom">
                <div class="row g-2 align-items-end">
                  <div class="col-md-3">
                    <label class="form-label small mb-1" for="filterInvoiceCode">Số hoá đơn</label>
                    <input type="search" class="form-control" id="filterInvoiceCode" placeholder="VD: HD000001" maxlength="30">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label small mb-1" for="filterInvoiceFrom">Từ ngày</label>
                    <input type="date" class="form-control" id="filterInvoiceFrom">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label small mb-1" for="filterInvoiceTo">Đến ngày</label>
                    <input type="date" class="form-control" id="filterInvoiceTo">
                  </div>
                  <div class="col-md-3">
                    <select class="form-select" id="invoicePageSize" aria-label="Số dòng mỗi trang">
                      <option value="10">10 dòng/trang</option>
                      <option value="20">20 dòng/trang</option>
                      <option value="50">50 dòng/trang</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Số HĐ</th><th>Thời gian</th><th class="text-center">Số món</th>
                      <th class="text-end">Tổng tiền</th><th class="text-end">Lợi nhuận</th><th>Thanh toán</th>
                      <th class="text-center">Trạng thái</th><th class="text-end">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="invoiceListBody"></tbody>
                </table>
              </div>
              <div class="card-body border-top" id="invoicePagination"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal chi tiết hoá đơn -->
  <div class="modal fade" id="invoiceDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="invoiceDetailTitle">Hoá đơn</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body" id="invoiceDetailBody"></div>
        <div class="modal-footer">
          <a class="btn btn-outline-primary" id="invoiceDetailPrint" target="_blank" rel="noopener"><i class="bi bi-printer me-1"></i>In hoá đơn</a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from "./js/layout.js";
    import { initSalesPage } from "./js/sales.js";
    initPage({ pageId: "sales", title: "Bán hàng" }, initSalesPage);
  </script>
</body>
</html>
