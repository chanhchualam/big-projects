<!DOCTYPE html>
<!--
  File: alerts.html
  Đường dẫn: chi tiêu/alerts.html
  Mục đích: Cảnh báo hàng sắp hết (tồn ≤ tồn tối thiểu) — cập nhật realtime
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cảnh báo | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
  <div class="auth-loading-screen"><div class="spinner-border text-primary" role="status" aria-label="Đang tải"></div></div>

  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="row g-3">
          <div class="col-12">
            <div class="card h-100">
              <div class="card-header d-flex align-items-center">
                <i class="bi bi-exclamation-triangle text-danger me-2"></i>Hàng sắp hết
                <span class="badge text-bg-danger ms-2" id="lowStockCount">…</span>
                <span class="badge text-bg-success ms-auto fw-normal"><i class="bi bi-broadcast"></i> realtime</span>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead><tr><th>Hàng hoá</th><th class="text-center">Tồn</th><th class="text-center">Tối thiểu</th><th class="text-end">Thao tác</th></tr></thead>
                  <tbody id="lowStockBody"></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from "./js/layout.js";
    import { initAlertsPage } from "./js/alerts.js";
    initPage({ pageId: "alerts", title: "Cảnh báo" }, initAlertsPage);
  </script>
</body>
</html>
