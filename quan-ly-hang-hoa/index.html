<!DOCTYPE html>
<!--
  File: index.html
  Đường dẫn: chi tiêu/index.html
  Mục đích: Màn hình đăng nhập (trang mặc định của ứng dụng)
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <!-- Đang kiểm tra phiên đăng nhập cũ -->
    <div id="authChecking" class="text-center text-white">
      <div class="spinner-border" role="status" aria-hidden="true"></div>
      <div class="mt-2">Đang kiểm tra đăng nhập...</div>
    </div>

    <div id="loginCard" class="card login-card d-none">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="login-logo mb-3"><i class="bi bi-box-seam"></i></div>
          <h1 class="h4 fw-bold mb-1">Quản lý hàng hoá</h1>
          <p class="text-muted mb-0">Đăng nhập để tiếp tục</p>
        </div>

        <div id="loginError" class="alert alert-danger d-none py-2" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="loginEmail" placeholder="admin@email.com"
                     autocomplete="username" required>
              <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="loginPassword" class="form-label">Mật khẩu</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="loginPassword" placeholder="••••••••"
                     autocomplete="current-password" minlength="6" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Hiện mật khẩu">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Mật khẩu tối thiểu 6 ký tự.</div>
            </div>
          </div>

          <button type="submit" id="loginSubmit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
          </button>

          <div class="text-center mt-3">
            <a href="#" id="forgotPassword" class="small text-decoration-none">Quên mật khẩu?</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLoginPage } from "./js/auth.js";
    initLoginPage();
  </script>
</body>
</html>
