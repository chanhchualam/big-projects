<!DOCTYPE html>
<!--
  File: new-products.html
  Đường dẫn: chi tiêu/new-products.html
  Mục đích: Sản phẩm mới — lưới card Bootstrap, sắp theo createdAt giảm dần,
            lọc danh mục, phân trang cursor, realtime
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm mới | Quản lý hàng hoá</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
  <div class="auth-loading-screen"><div class="spinner-border text-primary" role="status" aria-label="Đang tải"></div></div>

  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <select class="form-select w-auto" id="newCategoryFilter" aria-label="Lọc theo danh mục">
            <option value="">Tất cả danh mục</option>
          </select>
          <select class="form-select w-auto" id="newPageSize" aria-label="Số sản phẩm mỗi trang">
            <option value="12">12 sản phẩm/trang</option>
            <option value="24">24 sản phẩm/trang</option>
            <option value="48">48 sản phẩm/trang</option>
          </select>
          <span class="badge text-bg-success fw-normal"><i class="bi bi-broadcast"></i> realtime</span>
          <a href="products.html" class="btn btn-primary ms-auto"><i class="bi bi-plus-lg me-1"></i>Thêm hàng hoá</a>
        </div>

        <div class="row g-3" id="newProductsGrid">
          <div class="col-12 text-center py-5"><div class="spinner-border"></div></div>
        </div>

        <div class="card mt-3"><div class="card-body" id="newProductsPagination"></div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from "./js/layout.js";
    import { initNewProductsPage } from "./js/new-products.js";
    initPage({ pageId: "new-products", title: "Sản phẩm mới" }, initNewProductsPage);
  </script>
</body>
</html>
